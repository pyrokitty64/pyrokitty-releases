<!DOCTYPE html>
<html>
<head><title>GLB Render Test</title></head>
<body style="margin:0; background:#2a2a2a;">
<canvas id="c" width="456" height="336"></canvas>
<div style="color:white; padding:10px; font-family:monospace;">
  <div id="log"></div>
  <div style="margin-top:10px;">
    <button onclick="loadDress()">Load Dress GLB</button>
    <button onclick="loadBox()">Load Box GLB</button>
    <label style="margin-left:10px;"><input type="checkbox" id="flipY" checked> Texture flipY</label>
    <label style="margin-left:10px;"><input type="checkbox" id="doubleSide"> DoubleSide</label>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/loaders/GLTFLoader.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

const log = (msg) => { document.getElementById('log').innerHTML += msg + '<br>'; console.log(msg); };
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(456, 336);
renderer.setClearColor(0x2a2a2a);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 0.8);
key.position.set(2, 3, 2);
scene.add(key);
const fill = new THREE.DirectionalLight(0xd4e4ff, 0.4);
fill.position.set(-2, 1, -1);
scene.add(fill);

const camera = new THREE.PerspectiveCamera(35, 456/336, 0.01, 100);
const gltfLoader = new GLTFLoader();
const textureLoader = new THREE.TextureLoader();

let currentGroup = null;

function autoFrame(group) {
  scene.updateMatrixWorld(true);
  const bbox = new THREE.Box3().setFromObject(group);
  const center = new THREE.Vector3();
  bbox.getCenter(center);
  const size = new THREE.Vector3();
  bbox.getSize(size);
  const maxDim = Math.max(size.x, size.y, size.z);
  const radius = maxDim * 0.5 * 1.3;
  const fov = camera.fov * (Math.PI / 180);
  const dist = radius / Math.sin(fov / 2);
  const camOffset = new THREE.Vector3(0.7, 0.5, 1.0).normalize().multiplyScalar(dist);
  camera.position.copy(center).add(camOffset);
  camera.lookAt(center);
  camera.near = dist * 0.01;
  camera.far = dist * 10;
  camera.updateProjectionMatrix();
  log(`bbox: ${JSON.stringify({min: bbox.min.toArray().map(v=>v.toFixed(2)), max: bbox.max.toArray().map(v=>v.toFixed(2))})}`);
  log(`camera dist: ${dist.toFixed(2)}`);
}

function loadGLB(glbPath, texturePath, scale) {
  document.getElementById('log').innerHTML = '';
  if (currentGroup) { scene.remove(currentGroup); }

  fetch(glbPath).then(r => r.arrayBuffer()).then(buf => {
    gltfLoader.parse(buf, '', (gltf) => {
      const group = gltf.scene;
      let meshIdx = 0;
      group.traverse((child) => {
        if (child instanceof THREE.SkinnedMesh) log(`SkinnedMesh: ${child.name}`);
        if (!(child instanceof THREE.Mesh)) return;
        const geo = child.geometry;
        log(`Mesh[${meshIdx}] ${child.name}: ${geo.attributes.position.count} verts, skinned=${child instanceof THREE.SkinnedMesh}`);

        if (texturePath) {
          const flipY = document.getElementById('flipY').checked;
          const doubleSide = document.getElementById('doubleSide').checked;
          textureLoader.load(texturePath, (tex) => {
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.flipY = flipY;
            log(`Texture loaded, flipY=${flipY}`);
            const mat = new THREE.MeshStandardMaterial({
              map: tex, roughness: 0.6, metalness: 0.1,
              side: doubleSide ? THREE.DoubleSide : THREE.FrontSide,
            });
            child.material = mat;
            renderer.render(scene, camera);
          });
        }
        meshIdx++;
      });

      if (scale) group.scale.set(...scale);
      scene.add(group);
      currentGroup = group;
      autoFrame(group);
      renderer.render(scene, camera);
    });
  });
}

window.loadDress = () => loadGLB('test_dress.glb', 'test_dress_texture.png', null);
window.loadBox = () => loadGLB('test_box.glb', null, [0.5, 0.5, 0.5]);

log('Ready. Click a button to load.');
</script>
</body>
</html>
